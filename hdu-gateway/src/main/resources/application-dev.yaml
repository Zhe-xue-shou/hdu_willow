spring:
  cloud:
    gateway:
      discovery:
        locator:
          lower-case-service-id: true
      routes:
        - id: hdu-account
          uri: lb://hdu-account
          predicates:
            - Path=/account/**
          filters:
            - StripPrefix=1
        - id: hdu-auth
          uri: lb://hdu-auth
          predicates:
            - Path=/sso/**
          filters:
            - StripPrefix=1
        - id: hdu-interrupt
          uri: lb://hdu-interrupt
          predicates:
            - Path=/interrupt/**
          filters:
            - StripPrefix=1
        - id: hdu-record
          uri: lb://hdu-record
          predicates:
            - Path=/record/**
          filters:
            - StripPrefix=1
        - id: hdu-fpga
          uri: lb://hdu-fpga
          predicates:
            - Path=/fpga/**
          filters:
            - StripPrefix=1
        - id: hdu-vboard
          uri: lb://hdu-vboard
          predicates:
            - Path=/vboard/**
          filters:
            - StripPrefix=1
      globalcors: #跨域配置
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://127.0.0.1:8080" #允许跨域
              - "http://127.0.0.1:8081"
              - "http://127.0.0.1:8082"
              - "http://127.0.0.1:8083"
              - "http://127.0.0.1:5173"
              - "http://115.29.215.12:8080"
            allow-credentials: true
            allowed-headers: "*"
            allowedMethods: #请求方式
              - GET
              - POST
              - DELETE
              - PUT
              - PATCH
              - OPTIONS
              - HEAD
              - CONNECT
              - TRACE
            exposedHeaders: "uuid, Content-Disposition, Content-Type"
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
    nacos:
      discovery:
        server-addr: localhost:8848
        namespace: cea83c1b-7a99-4bb1-8596-895a4faab520
  application:
    name: hdu-gateway
server:
  port: 8501