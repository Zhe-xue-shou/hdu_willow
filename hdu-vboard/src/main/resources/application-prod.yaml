spring:
  application:
    name: hdu-vboard
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        namespace: cea83c1b-7a99-4bb1-8596-895a4faab520
  redis:
    host: localhost
    database: 1
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: MySQL142536
    url: jdbc:mysql://localhost:3306/hdu-interrupt?allowMultiQueries=true&useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
seata:
  service:
    vgroup-mapping:
      hdu-account-seata-service-group: default
      hdu-interrupt-seata-service-group: default
      hdu-fpga-seata-service-group: default
      hdu-record-seata-service-group: default
    grouplist:
      default: localhost:8091
server:
  port: 9999
  # 关键配置：信任代理头
  forward-headers-strategy: framework
  tomcat:
    remoteip:
      remote-ip-header: X-Forwarded-For
      protocol-header: X-Forwarded-Proto
      host-header: X-Forwarded-Host
      # 信任所有代理（根据实际情况调整）
      internal-proxies: .*
  # 如果使用 Undertow
  undertow:
    options:
      # 允许编码斜杠
      ALLOW_ENCODED_SLASH: true
netty:
  port: 60020
  boss:
    thread:
      count: 2
  worker:
    thread:
      count: 2
  keepalive: false
  backlog: 100
#wait-queue:
#  name: "queue:fpgaWaitLine"
dubbo:
  application:
    name: ${spring.application.name}
  protocol:
    name: dubbo
    port: -1
  registry:
    address: nacos://localhost:8848
    group: dubbo
    register-mode: interface
    parameters:
      namespace: c29600b0-2e5d-450b-bab0-e56d78292d51
  metadata-report:
    address: nacos://localhost:8848
#logging:
#  level:
#    com.hdu.vboard: debug
cors:
  allowed-origins: https://vfpga.hdu.edu.cn , http://vfpga.hdu.edu.cn

  # constants
script:
  pyPath:
    "/usr/bin/python3"
  filePath:
    "src/main/python/script/create_workbench.py"
verilator:
  path:
    "/usr/local/bin/verilator"

sa-token:
  # Token名称
  token-name: satoken
  # Token有效期
  timeout: 2592000
  # Token风格
  token-style: uuid

  # 配置 Sa-Token 单独使用的 Redis 连接
  alone-redis:
    # Redis数据库索引（默认为0）
    database: 2
    # Redis服务器地址
    host: 127.0.0.1
    # Redis服务器连接端口
    port: 6379
    # Redis服务器连接密码（默认为空）
    password:
    # 连接超时时间
    timeout: 10s