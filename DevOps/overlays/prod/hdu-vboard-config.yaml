apiVersion: apps/v1
kind: Deployment
metadata:
  name: hdu-vboard
  namespace: fpga
spec:
  replicas: 3
  template:
    spec:
      containers:
        - name: hdu-vboard
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
