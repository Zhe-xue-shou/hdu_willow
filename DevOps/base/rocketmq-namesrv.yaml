apiVersion: apps/v1
kind: Deployment
metadata:
  name: rmq-namesrv
  namespace: fpga
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rmq-namesrv
  template:
    metadata:
      labels:
        app: rmq-namesrv
    spec:
      nodeSelector:
        role: dis
      containers:
        - name: rmq-namesrv
          image: apache/rocketmq:5.3.1
          command: [ "sh", "mqnamesrv" ]
          ports:
            - containerPort: 9876
---
apiVersion: v1
kind: Service
metadata:
  name: rmq-namesrv
  namespace: fpga
spec:
  ports:
    - port: 9876
      targetPort: 9876
  selector:
    app: rmq-namesrv
