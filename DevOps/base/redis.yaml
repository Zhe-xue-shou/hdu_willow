apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: fpga
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      nodeSelector:
        role: db
      containers:
        - name: redis
          image: redis:6.2.7
          ports:
            - containerPort: 6379
          command: [ "redis-server", "/usr/local/etc/redis/redis.conf" ]
          volumeMounts:
            - name: redis-config
              mountPath: /usr/local/etc/redis/redis.conf
              subPath: redis.conf   # 从 configmap 提取单文件
            - name: redis-log
              mountPath: /var/log
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-config
          configMap:
            name: redis-config
        - name: redis-log
          persistentVolumeClaim:
            claimName: redis-log-pvc
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: fpga
spec:
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app: redis
